  <text class="label2" x="1415" y="326">Google ADK</text>

  <rect class="futureBox" x="1188" y="420" width="142" height="108"/>
  <text class="label" x="1238" y="447">STATE</text>
  <text class="label2" x="1219" y="478">Firestore</text>
