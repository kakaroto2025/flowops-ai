<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">FlowOps AI - Agentic Document Operations Architecture</title>
  <desc id="desc">Current MVP architecture and production target for FlowOps AI, showing FastAPI, Google ADK, Gemini 3.6 Flash, Human Review, duplicate blocking, audit trail, local persistence, and future cloud services.</desc>
  <defs>
    <style>
      .bg { fill: #07111f; }
      .panel { fill: #0e1a2a; stroke: #24425f; stroke-width: 1.5; }
      .panelFuture { fill: #0b1624; stroke: #6b7d92; stroke-width: 1.5; stroke-dasharray: 8 8; opacity: .78; }
      .lane { fill: #101f31; stroke: #2c4a6b; stroke-width: 1; }
      .box { fill: #132235; stroke: #355879; stroke-width: 1.2; rx: 10; }
      .boxSmall { fill: #132235; stroke: #355879; stroke-width: 1.1; rx: 8; }
      .google { fill: #122942; stroke: #62a8ff; stroke-width: 2.4; rx: 10; }
      .gemini { fill: #1b2444; stroke: #a78bfa; stroke-width: 2.4; rx: 10; }
      .decision { fill: #18263a; stroke: #f7b955; stroke-width: 2; rx: 10; }
      .success { fill: #102b25; stroke: #21c58b; stroke-width: 1.8; rx: 10; }
      .review { fill: #2a2135; stroke: #e4a94f; stroke-width: 1.8; rx: 10; }
      .duplicate { fill: #2b1d28; stroke: #f46b7b; stroke-width: 1.8; rx: 10; }
      .audit { fill: #102335; stroke: #6dd6ff; stroke-width: 1.5; rx: 10; }
      .store { fill: #132b26; stroke: #54d6a0; stroke-width: 1.5; rx: 10; }
      .futureBox { fill: #111b29; stroke: #8293a8; stroke-width: 1; stroke-dasharray: 5 5; rx: 8; opacity: .82; }
      .title { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 46px; font-weight: 800; fill: #f8fbff; letter-spacing: 0; }
      .subtitle { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 22px; font-weight: 600; fill: #b8d7ff; letter-spacing: 0; }
      .minor { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 16px; fill: #8fb2d6; letter-spacing: 0; }
      .section { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 18px; font-weight: 800; fill: #ffcc4d; letter-spacing: 0; }
      .sectionFuture { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 17px; font-weight: 800; fill: #aebcd0; letter-spacing: 0; }
      .label { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #f4f8ff; letter-spacing: 0; }
      .label2 { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 13px; fill: #a9c4df; letter-spacing: 0; }
      .labelSmall { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 12px; fill: #a9c4df; letter-spacing: 0; }
      .pill { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 12px; font-weight: 800; fill: #07111f; letter-spacing: 0; }
      .arrow { stroke: #9fc4ec; stroke-width: 2.2; fill: none; marker-end: url(#arrowHead); }
      .arrowSoft { stroke: #7fa5cb; stroke-width: 1.7; fill: none; marker-end: url(#arrowHeadSoft); opacity: .8; }
      .arrowDash { stroke: #a78bfa; stroke-width: 1.8; stroke-dasharray: 6 6; fill: none; marker-end: url(#arrowHeadPurple); opacity: .9; }
      .eventDash { stroke: #6dd6ff; stroke-width: 1.4; stroke-dasharray: 4 7; fill: none; marker-end: url(#arrowHeadCyan); opacity: .65; }
      .futureArrow { stroke: #9aa8ba; stroke-width: 1.5; stroke-dasharray: 5 6; fill: none; marker-end: url(#arrowHeadFuture); opacity: .65; }
    </style>
    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9fc4ec"/>
    </marker>
    <marker id="arrowHeadSoft" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7fa5cb"/>
    </marker>
    <marker id="arrowHeadPurple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#a78bfa"/>
    </marker>
    <marker id="arrowHeadCyan" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6dd6ff"/>
    </marker>
    <marker id="arrowHeadFuture" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9aa8ba"/>
    </marker>
