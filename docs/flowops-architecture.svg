<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">FlowOps AI Multi-Country Architecture</title>
  <desc id="desc">FlowOps AI current MVP architecture showing a Cloud Run hosted runtime, Secret Manager for Gemini credentials, one agentic workflow with country-specific rules for Brazil and United States, powered by Google ADK, Gemini 3.6 Flash, fallback extraction, validation, decisions, human review, duplicate protection, audit trail, and ephemeral LocalStore persistence. Future production targets are separated.</desc>
