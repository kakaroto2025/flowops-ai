      .title { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 46px; font-weight: 850; fill: #f7fbff; letter-spacing: 0; }
      .subtitle { font-family: Inter, Segoe UI, Arial, sans-serif; font-size: 21px; font-weight: 650; fill: #b8d7ff; letter-spacing: 0; }
